name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for recovery only (for example v0.1.1)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Set up npm
        run: npm install --global npm@11.5.1

      - name: Set package version from release tag
        run: |
          case "$RELEASE_TAG" in
            v*) release_version="${RELEASE_TAG#v}" ;;
            *) echo "Release tag must start with v; received $RELEASE_TAG" >&2; exit 1 ;;
          esac
          npm version "$release_version" --no-git-tag-version --allow-same-version
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists on npm; versions cannot be overwritten" >&2
            exit 1
          fi

      - name: Validate package
        run: |
          npm run validate
          npm run test:guardrails
          npm run test:misses
          npm pack --dry-run

      - name: Check release commit whitespace
        if: github.event_name == 'release'
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= HEAD
          fi

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Set up npm
        run: npm install --global npm@11.5.1

      - name: Publish release tag through npm trusted publishing
        run: |
          release_version="${RELEASE_TAG#v}"
          npm version "$release_version" --no-git-tag-version --allow-same-version
          npm_tag=latest
          case "$release_version" in *-*) npm_tag=next ;; esac
          npm publish --access public --provenance --tag "$npm_tag"
