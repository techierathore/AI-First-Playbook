# Per-phase model routing for the AI-First Playbook.
#
# Each command (the unit a phase is entered through) declares the model TIER
# it needs; tiers resolve to concrete OpenCode models. Target installs retain
# this map for telemetry attribution. A full framework source checkout also
# provides the optional routing utilities:
#
#   node scripts/playbook-routing.mjs status | on | off | set-tier | set-model | set-escalation | bind
#
# Lower level, still supported:
#   node scripts/apply-model-tiers.mjs          # stamps/strips harness/opencode frontmatter
#
# The models below are working defaults. Source-checkout operators may substitute
# their provider/models and re-run the apply script.
version: 1

# Master switch — OFF by default. While off, no
# OpenCode file carries a model: stamp and every phase runs on the session
# model; the map below is kept but dormant. Flip with: playbook-routing.mjs on|off
enabled: false

tiers:
  frontier:
    opencode: "anthropic/claude-opus-5"
  standard:
    opencode: "anthropic/claude-sonnet-5"
  economy:
    opencode: "anthropic/claude-haiku-4-5"

# Phase-entry commands. "none" would mean deterministic/human - no such
# command exists today; gates run without model turns.
commands:
  feature-plan: frontier        # P1 - spec synthesis; costliest place to be wrong
  upgrade-docs: standard        # P1 alt-entry - constrained doc transformation
  add-doc: standard             # derive docs from real code
  refresh-doc: standard         # reconcile docs against code drift
  implement: standard           # P3 - wave planning over an explicit checklist
  verify: standard              # P5 - prescriptive evidence gathering
  fix: standard                 # P7 - targeted fixes; escalate per `escalation`
  analyze-fix: frontier         # P9/P10 - root cause + verification-gap reasoning
  log-miss: standard            # one-line closed-vocabulary miss classification
  legacy-audit: frontier        # discovery over uncharacterised code
  create-issue-list: economy    # mechanical tracker-to-markdown transcription
  amend-checklist: economy      # mechanical in-place edits
  archive-checklist: economy    # mechanical rotation
  generate-html: economy        # mechanical conversion

# Agent fallbacks: apply when something invokes the agent without going
# through a tier-stamped command (command model outranks agent model).
agents:
  analyst: frontier
  orchestrator: standard
  builder: standard             # /implement + /fix wave workers - the big leak plug
  verifier: standard

# Advisory escalation, applied by whoever launches the command (human or
# wrapper script) by reading attempt history from the checklist Run Log.
escalation:
  fix:
    after_attempts: 2
    tier: frontier
